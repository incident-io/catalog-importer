name: Build

on: [push]

# We need this so we can tag our repo if the build succeeds and the version
# doesn't match.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: '${{ steps.tag.outputs.release }}'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      -
        name: Build
        run: go run cmd/catalog-importer/main.go --help
      -
        name: Install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      -
        name: Run tests
        run: ginkgo -r .
      -
        # Not needed to *build* the arm64 image (buildx handles cross-arch
        # builds on its own, RUN steps included) — but the smoke test below
        # runs the arm64 image on the host engine, which needs binfmt
        # handlers registered. Verified empirically: without this, the
        # snapshot build passes and the arm64 smoke run fails with an exec
        # format error.
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # The real release only runs on master, so validate the release
        # config (including the multi-arch Docker builds) on every branch to
        # catch breakage before it reaches a release.
        name: Validate release config (snapshot)
        if: github.ref != 'refs/heads/master'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --snapshot --clean
      -
        # Prove the cross-built images actually execute, not just build
        # (arm64 runs under QEMU emulation).
        name: Smoke test snapshot images
        if: github.ref != 'refs/heads/master'
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            image="incidentio/catalog-importer:latest-${arch}"

            docker run --rm --platform "linux/${arch}" "$image" --help

            # Prove the image completes a TLS handshake using the certificate
            # bundle we ship. `--help` does not touch the network, so it could
            # not catch a missing or broken bundle. `types` calls the real API,
            # and a 401 can only come back after the handshake and the HTTP
            # round trip both succeeded, which is all we assert here. A broken
            # bundle fails with an x509 error well before that.
            out=$(docker run --rm --platform "linux/${arch}" "$image" \
              types --api-key=invalid 2>&1 || true)

            echo "${out}"
            if ! grep -q 'status 401' <<<"${out}"; then
              echo "::error::${arch}: expected a 401 from the API. TLS or the certificate bundle looks broken."
              exit 1
            fi
          done
      -
        id: tag
        name: Tag if new version
        if: github.ref == 'refs/heads/master'
        run: |
          CURRENT_VERSION="v$(cat cmd/catalog-importer/cmd/VERSION)"
          if [[ $(git tag -l "${CURRENT_VERSION}") == "${CURRENT_VERSION}" ]]; then
            echo "Version ${CURRENT_VERSION} is already released"
            echo "release=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "${CURRENT_VERSION}"
          git push --tags
          echo "release=yes" >> "$GITHUB_OUTPUT"
      -
        name: Login to Docker Hub
        if: steps.tag.outputs.release == 'yes'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_PUBLISHER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PUBLISHER_KEY }}
      -
        name: Run GoReleaser
        if: steps.tag.outputs.release == 'yes'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
